<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shrey Mistry - PM @ Geotab | CS Student | Builder of things">
  <meta name="author" content="Shrey Mistry">
  <title>Shrey's Terminal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%23001a00'/><text x='4' y='22' font-family='monospace' font-size='18' fill='%2333ff33'>%3E_</text></svg>">
  <meta property="og:title" content="Shrey Mistry - Terminal Portfolio">
  <meta property="og:description" content="Interactive CRT terminal portfolio - type commands to explore. Built with vanilla HTML/CSS/JS.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://shreywy.github.io">
  <meta name="theme-color" content="#33ff33">
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=DM+Sans:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --text: #33ff33;
      --bg: #001a00;
      --dim: #0a6b0a;
      --bright: #66ff66;
      --accent: #00cc00;
    }

    [data-color="amber"] {
      --text: #ffaa00;
      --bg: #1a0f00;
      --dim: #664400;
      --bright: #ffdd00;
      --accent: #ff9900;
    }

    [data-color="blue"] {
      --text: #00aaff;
      --bg: #000a1a;
      --dim: #004466;
      --bright: #00ddff;
      --accent: #0088ff;
    }

    /* ============ FULLSCREEN CRT SCREEN ============ */
    html, body { height: 100%; }
    body {
      background: #000;
      color: var(--text);
      font-family: 'VT323', monospace;
      font-size: 1.15rem;
      line-height: 1.5;
      overflow: hidden;
      text-shadow: 0 0 4px rgba(51,255,51,0.35), -0.5px 0 rgba(255,50,50,0.05), 0.5px 0 rgba(50,50,255,0.05);
    }

    /* CRT Screen container */
    #screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      border-radius: 14px;
      overflow: hidden;
      background: var(--bg);
      box-shadow: inset 0 0 80px rgba(0,0,0,0.4), inset 0 0 120px rgba(51,255,51,0.06);
    }

    /* Subtle CRT flicker */
    @keyframes crtFlicker {
      0%, 94%, 100% { opacity: 1; }
      95% { opacity: 0.97; }
      97% { opacity: 0.99; }
      98% { opacity: 0.96; }
    }
    #screen { animation: crtFlicker 8s infinite; }

    /* CRT Scanlines overlay */
    #screen::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15),
        rgba(0, 0, 0, 0.15) 2px,
        transparent 2px,
        transparent 4px
      );
      z-index: 10;
    }

    /* CRT Vignette overlay */
    #screen::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 0%, rgba(0, 0, 0, 0.4) 100%);
      z-index: 11;
    }

    /* Content wrapper (below overlays) */
    #content {
      flex: 1;
      overflow: hidden;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* ============ BOOT SEQUENCE ============ */
    #boot {
      flex: 1;
      min-height: 0;
      padding: 20px;
      overflow-y: auto;
    }

    .boot-line { white-space: pre-wrap; }

    /* Power-on flicker */
    @keyframes flickerBoot {
      0% { opacity: 1; }
      25% { opacity: 0.2; }
      50% { opacity: 0.8; }
      75% { opacity: 0.1; }
      100% { opacity: 1; }
    }
    #screen.booting { animation: flickerBoot 0.08s 6; }

    /* ============ TERMINAL ============ */
    #terminal {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      scroll-behavior: smooth;
      padding: 20px;
      padding-bottom: 60px;
    }
    #terminal[hidden] { display: none; }

    #terminal::-webkit-scrollbar { width: 4px; }
    #terminal::-webkit-scrollbar-track { background: transparent; }
    #terminal::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }

    #output { }

    .tl { white-space: pre-wrap; word-break: break-word; }
    .tl.b { color: var(--bright); text-shadow: 0 0 8px rgba(51,255,51,0.4); }
    .tl.d { color: var(--dim); }
    .tl.a { color: var(--accent); }

    #inputRow {
      display: flex;
      align-items: baseline;
    }

    #prompt {
      color: var(--bright);
      user-select: none;
      white-space: pre;
    }

    #input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font: inherit;
      outline: none;
      caret-color: var(--text);
      padding: 0;
      margin: 0;
    }

    /* ============ EXPERIENCE / PROJECT CARDS ============ */
    .exp-timeline {
      position: relative;
      padding-left: 120px;
      margin: 8px 0;
    }
    .exp-timeline::before {
      content: '';
      position: absolute;
      left: 108px; top: 0; bottom: 0;
      width: 2px;
      background: var(--dim);
    }
    .exp-card {
      border: 1px solid var(--dim); border-radius: 4px;
      padding: 12px 14px; background: rgba(255,255,255,0.015);
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.4s;
      opacity: 0; transform: translateY(12px);
      cursor: default; position: relative;
      margin-bottom: 12px;
    }
    .exp-timeline .exp-card::before {
      content: '';
      position: absolute;
      left: -17px; top: 16px;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg);
      z-index: 1;
    }
    .exp-timeline .exp-card::after {
      content: '';
      position: absolute;
      left: -12px; top: 20px;
      width: 8px; height: 2px;
      background: var(--dim);
    }
    .ec-date {
      position: absolute;
      left: -115px; top: 14px;
      width: 90px;
      text-align: right;
      color: var(--dim);
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .exp-card.show { opacity: 1; transform: translateY(0); }
    .exp-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.3), 0 0 10px rgba(51,255,51,0.15); }
    .proj-cards { margin: 8px 0; }
    .ec-t { color: var(--bright); }
    .ec-c { color: var(--accent); }
    .ec-p { color: var(--dim); font-size: 0.95rem; }
    .ec-d { color: var(--text); opacity: 0.7; margin-top: 4px; }
    .ec-s { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .ec-sk { font-size: 0.9rem; padding: 1px 8px; border: 1px solid var(--dim); color: var(--dim); }
    .pc-link {
      font-family: 'VT323'; font-size: 0.95rem; padding: 2px 10px;
      border: 1px solid var(--dim); color: var(--accent);
      background: transparent; cursor: pointer; text-decoration: none;
      display: inline-block; margin-top: 6px;
    }
    .pc-link:hover { background: rgba(255,255,255,0.04); color: var(--bright); border-color: var(--accent); }

    /* ============ NEOFETCH ============ */
    .neofetch-wrap {
      display: flex;
      gap: 20px;
      margin: 4px 0;
      align-items: flex-start;
    }
    .nf-logo-pre {
      color: var(--bright);
      text-shadow: 0 0 8px rgba(51,255,51,0.4);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      line-height: 1.3;
      white-space: pre;
      flex-shrink: 0;
    }
    .nf-info-col { flex: 1; }
    .nf-info-col div { white-space: pre; }
    .nf-key { color: var(--accent); }
    .nf-val { color: var(--text); }
    .nf-sep { color: var(--dim); }

    /* ============ COMMAND PALETTE ============ */
    #commandPalette {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--bg);
      border: 1px solid var(--text);
      border-radius: 6px;
      z-index: 100;
      width: 380px;
      max-height: 70vh;
      overflow-y: auto;
      box-shadow: 0 0 40px rgba(51,255,51,0.15), 0 20px 60px rgba(0,0,0,0.5);
    }
    #commandPalette::-webkit-scrollbar { width: 4px; }
    #commandPalette::-webkit-scrollbar-thumb { background: var(--dim); }

    .palette-header {
      padding: 10px 16px 0;
      color: var(--dim);
      font-size: 0.85rem;
    }
    .palette-tabs {
      display: flex;
      gap: 0;
      padding: 8px 16px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .palette-tab {
      padding: 6px 16px;
      cursor: pointer;
      color: var(--dim);
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }
    .palette-tab:hover { color: var(--text); }
    .palette-tab.active {
      color: var(--bright);
      border-bottom-color: var(--bright);
    }

    .palette-item {
      padding: 10px 16px;
      color: var(--text);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .palette-item:last-child { border-bottom: none; }
    .palette-item .pi-cmd { color: var(--bright); }
    .palette-item .pi-desc { color: var(--dim); font-size: 0.85rem; }

    .palette-item.selected {
      background: rgba(51,255,51,0.08);
    }
    .palette-item:hover {
      background: rgba(51,255,51,0.05);
    }

    /* ============ QUICKBAR - HIDDEN, use / key instead ============ */
    #quickbar { display: none; }
    #hintbar { display: none; }

    /* ============ WIN98 WINDOW SYSTEM ============ */
    .w98 {
      position: absolute;
      background: #c0c0c0;
      border: 2px solid;
      border-color: #dfdfdf #404040 #404040 #dfdfdf;
      box-shadow: 1px 1px 0 #000, inset 1px 1px 0 #fff;
      display: flex;
      flex-direction: column;
      min-width: 300px;
      min-height: 200px;
      z-index: 50;
    }

    .w98.closing {
      animation: winClose 0.25s ease-in forwards;
      pointer-events: none;
    }

    @keyframes winClose {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0.05); opacity: 0; }
    }

    .w98-title {
      background: linear-gradient(90deg, #000080, #1084d0);
      color: white;
      padding: 2px 3px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      cursor: move;
      font-family: Tahoma, 'MS Sans Serif', Arial, sans-serif;
      font-size: 11px;
      font-weight: bold;
    }

    .w98-title-text {
      flex: 1;
      padding: 2px 4px;
    }

    .w98-close {
      width: 16px;
      height: 14px;
      background: #c0c0c0;
      border: 1px solid;
      border-color: #dfdfdf #404040 #404040 #dfdfdf;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 9px;
      font-weight: bold;
      color: #000;
      font-family: Tahoma, sans-serif;
      margin: 2px;
    }

    .w98-close:active {
      border-color: #404040 #dfdfdf #dfdfdf #404040;
      padding: 1px 0 0 1px;
    }

    .w98-content {
      flex: 1;
      overflow: hidden;
      background: #c0c0c0;
      padding: 4px;
      min-height: 0;
    }

    .w98-resize {
      width: 16px;
      height: 16px;
      background: linear-gradient(135deg, white 0%, white 50%, #808080 50%, #808080 100%);
      cursor: nwse-resize;
      position: absolute;
      bottom: 0;
      right: 0;
    }

    /* ============ BROWSER WINDOW ============ */
    #browserWindow {
      display: none;
      position: fixed;
      top: 30px; right: 20px;
      width: 55%;
      height: 85vh;
      z-index: 55;
    }
    @media (max-width: 900px) {
      #browserWindow { width: 100% !important; left: 0 !important; }
    }

    .browser-toolbar {
      background: #c0c0c0;
      padding: 4px;
      display: flex;
      gap: 4px;
      align-items: center;
      border-bottom: 2px inset #c0c0c0;
    }

    .browser-btn {
      width: 22px;
      height: 22px;
      background: #c0c0c0;
      border: 2px outset #dfdfdf;
      border-left-color: white;
      border-top-color: white;
      border-right-color: #808080;
      border-bottom-color: #808080;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    }

    .browser-btn:active {
      border-style: inset;
    }

    .browser-address {
      flex: 1;
      background: white;
      padding: 2px 4px;
      border: 2px inset;
      border-color: #808080 white white #808080;
      font-family: 'MS Sans Serif', Arial, sans-serif;
      font-size: 12px;
      color: black;
    }

    .browser-tabs {
      background: #c0c0c0;
      display: flex;
      gap: 2px;
      padding: 4px;
      border-bottom: 1px solid #808080;
    }

    .browser-tab {
      background: #dfdfdf;
      border: 2px outset;
      border-color: white #808080 #808080 white;
      padding: 4px 8px;
      cursor: pointer;
      font-family: 'MS Sans Serif', Arial, sans-serif;
      font-size: 12px;
      color: black;
    }

    .browser-tab.active {
      background: #c0c0c0;
      border-style: inset;
    }

    .browser-content {
      background: white;
      overflow: auto;
    }

    /* ============ PORTFOLIO PAGE (inside browser) ============ */
    .portfolio-page {
      background: #f5f0e8;
      color: #333;
      font-family: 'Times New Roman', Georgia, serif;
      font-size: 14px;
      line-height: 1.7;
      padding: 30px 40px;
      min-height: 100%;
    }
    .portfolio-page h1 {
      font-size: 28px;
      margin: 0 0 4px;
      color: #1a1a1a;
    }
    .portfolio-page .pp-tagline {
      font-size: 13px;
      color: #666;
      margin-bottom: 16px;
    }
    .portfolio-page hr {
      border: none;
      border-top: 1px solid #999;
      margin: 16px 0;
    }
    .portfolio-page h2 {
      font-size: 18px;
      margin: 20px 0 10px;
      color: #1a1a1a;
      border-bottom: 1px solid #ccc;
      padding-bottom: 4px;
    }
    .portfolio-page .pp-exp {
      margin-bottom: 14px;
    }
    .portfolio-page .pp-exp-title {
      font-weight: bold;
      font-size: 14px;
    }
    .portfolio-page .pp-exp-co {
      font-style: italic;
      color: #555;
      font-size: 13px;
    }
    .portfolio-page .pp-exp-desc {
      font-size: 13px;
      color: #444;
      margin-top: 2px;
    }
    .portfolio-page .pp-skills {
      font-size: 13px;
      color: #444;
      margin-top: 2px;
    }
    .portfolio-page .pp-skill-tag {
      display: inline;
      font-size: 12px;
    }
    .portfolio-page .pp-contact {
      margin-top: 16px;
      font-size: 13px;
    }
    .portfolio-page .pp-contact a {
      color: #0000cc;
      text-decoration: underline;
    }
    .portfolio-page .pp-footer {
      margin-top: 24px;
      font-size: 11px;
      color: #999;
      text-align: center;
    }

    /* ============ PAINT WINDOW ============ */
    #paintWindow {
      display: none;
      width: 600px;
      height: 500px;
      left: 50px;
      top: 50px;
    }

    .paint-toolbar {
      background: #c0c0c0;
      padding: 4px;
      border-bottom: 2px inset;
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .paint-tool {
      width: 26px;
      height: 26px;
      background: #c0c0c0;
      border: 2px outset;
      border-color: white #808080 #808080 white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      user-select: none;
    }

    .paint-tool.active {
      border-style: inset;
    }

    .paint-tool:active {
      border-style: inset;
    }

    .paint-colors {
      display: flex;
      gap: 2px;
      padding: 4px;
      background: #c0c0c0;
      border-bottom: 2px inset;
      flex-wrap: wrap;
    }

    .paint-color {
      width: 16px;
      height: 16px;
      border: 2px outset;
      cursor: pointer;
    }

    .paint-color.selected {
      border-style: inset;
    }

    .paint-canvas {
      flex: 1;
      background: white;
      cursor: crosshair;
      margin: 4px;
      border: 2px solid;
      border-color: #808080 #dfdfdf #dfdfdf #808080;
    }

    /* ============ FILE EXPLORER ============ */
    #explorerWindow {
      display: none;
      width: 700px;
      height: 500px;
      left: 100px;
      top: 100px;
    }

    .explorer-toolbar {
      background: #c0c0c0;
      padding: 4px;
      border-bottom: 2px inset;
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .explorer-address {
      flex: 1;
      background: white;
      padding: 2px 4px;
      border: 2px inset;
      border-color: #808080 white white #808080;
      font-family: 'MS Sans Serif', Arial, sans-serif;
      font-size: 12px;
      color: black;
      cursor: text;
    }

    .explorer-split {
      display: flex;
      flex: 1;
      gap: 4px;
    }

    .explorer-panel {
      flex: 1;
      background: white;
      border: 2px inset;
      border-color: #808080 white white #808080;
      overflow: auto;
      font-family: 'MS Sans Serif', Arial, sans-serif;
      font-size: 12px;
      color: black;
    }

    .explorer-item {
      padding: 4px 4px;
      cursor: pointer;
      user-select: none;
    }

    .explorer-item:hover {
      background: #000080;
      color: white;
    }

    .explorer-item-icon {
      display: inline-block;
      width: 16px;
      height: 16px;
      margin-right: 4px;
      vertical-align: middle;
    }

    /* ============ PAINT LEFT TOOLBAR ============ */
    .paint-tools-left {
      width: 36px;
      background: #c0c0c0;
      border-right: 1px solid #808080;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 4px 3px;
      flex-shrink: 0;
    }
    .paint-colors-bottom {
      display: flex;
      gap: 2px;
      padding: 3px 4px;
      background: #c0c0c0;
      border-top: 2px solid #dfdfdf;
      flex-wrap: wrap;
      align-items: center;
      flex-shrink: 0;
    }

    /* ============ NOTEPAD ============ */
    .notepad-menu {
      background: #c0c0c0;
      padding: 1px 4px;
      border-bottom: 1px solid #808080;
      font-family: Tahoma, 'MS Sans Serif', Arial, sans-serif;
      font-size: 11px;
      display: flex;
      gap: 0;
    }

    .nm-item {
      cursor: default;
      padding: 2px 8px;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 11px;
      color: #000;
      user-select: none;
    }
    .nm-item:hover {
      background: #000080;
      color: #fff;
    }
    .nm-item u { text-decoration: underline; }

    .notepad-textarea {
      flex: 1;
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      padding: 4px;
      background: #fff;
      color: #000;
    }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 768px) {
      .exp-timeline { padding-left: 24px; }
      .exp-timeline::before { left: 6px; }
      .exp-timeline .exp-card::before { left: -22px; }
      .exp-timeline .exp-card::after { left: -16px; }
      .ec-date { display: none; }

      body {
        font-size: 0.9rem;
      }

      #boot, #terminal {
        font-size: 0.85rem;
        padding: 10px;
      }

      .boot-line {
        font-size: 0.85rem;
      }

      .tl {
        font-size: 0.85rem;
      }

      #inputRow {
        padding: 8px 10px;
      }

      #prompt, #input, #cursor {
        font-size: 0.85rem;
      }

      #browserWindow {
        width: 95vw !important;
        height: 90vh !important;
        left: 2.5vw !important;
        top: 5vh !important;
      }

      #paintWindow {
        width: 95vw !important;
        height: 85vh !important;
        left: 2.5vw !important;
        top: 7.5vh !important;
      }

      #explorerWindow {
        width: 95vw !important;
        height: 85vh !important;
        left: 2.5vw !important;
        top: 7.5vh !important;
      }

      #quickbar {
        flex-wrap: wrap;
      }

      .quickbar-btn {
        font-size: 0.85rem;
        padding: 3px 6px;
      }
    }

    /* ============ TEXT STYLING ============ */
    .bright { color: var(--bright); }
    .dim { color: var(--dim); }
    .accent { color: var(--accent); }
  </style>
</head>
<body>
  <div id="screen">
    <div id="content">
      <div id="boot"></div>
      <div id="terminal" hidden>
        <div id="output"></div>
        <div id="inputRow">
          <span id="prompt">C:\Users\shrey&gt; </span>
          <input type="text" id="input" autocomplete="off" spellcheck="false">
        </div>
        <div id="commandPalette"></div>
      </div>
    </div>

    // ============ AUDIO ============
    let audioContext;
    function initAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function sndType() {
      try {
        if (!audioContext) initAudio();
        const o = audioContext.createOscillator(), g = audioContext.createGain();
        o.connect(g); g.connect(audioContext.destination);
        o.frequency.value = 800;
        g.gain.setValueAtTime(0.1, audioContext.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.05);
        o.start(audioContext.currentTime); o.stop(audioContext.currentTime + 0.05);
      } catch(e) {}
    }

    function sndBeep(freq, dur) {
      try {
        freq = freq || 1000; dur = dur || 0.1;
        if (!audioContext) initAudio();
        const o = audioContext.createOscillator(), g = audioContext.createGain();
        o.connect(g); g.connect(audioContext.destination);
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.3, audioContext.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + dur);
        o.start(audioContext.currentTime); o.stop(audioContext.currentTime + dur);
      } catch(e) {}
    }

    function sndZap() {
      try {
        if (!audioContext) initAudio();
        const buf = audioContext.createBuffer(1, audioContext.sampleRate * 0.1, audioContext.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        const s = audioContext.createBufferSource(), g = audioContext.createGain();
        s.buffer = buf; s.connect(g); g.connect(audioContext.destination);
        g.gain.setValueAtTime(0.3, audioContext.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
        s.start(audioContext.currentTime);
      } catch(e) {}
    }

    function sndHum() {
      try {
        if (!audioContext) initAudio();
        const o = audioContext.createOscillator(), g = audioContext.createGain();
        o.connect(g); g.connect(audioContext.destination);
        o.frequency.value = 60;
        g.gain.setValueAtTime(0.05, audioContext.currentTime);
        g.gain.exponentialRampToValueAtTime(0.02, audioContext.currentTime + 2);
        o.start(audioContext.currentTime); o.stop(audioContext.currentTime + 2);
      } catch(e) {}
    }

    function sndEnter() { sndBeep(1200, 0.08); }

    function sndBlip() {
      try {
        if (!audioContext) initAudio();
        const o = audioContext.createOscillator(), g = audioContext.createGain();
        o.connect(g); g.connect(audioContext.destination);
        o.frequency.setValueAtTime(400, audioContext.currentTime);
        o.frequency.exponentialRampToValueAtTime(600, audioContext.currentTime + 0.05);
        g.gain.setValueAtTime(0.1, audioContext.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.05);
        o.start(audioContext.currentTime); o.stop(audioContext.currentTime + 0.05);
      } catch(e) {}
    }

    // ============ BOOT SEQUENCE ============

    function displayBootLine() {
      const bl = getBootLines();
      if (bootSkipped || bootIndex >= bl.length) {
        if (bootSkipped) {
          const bootEl = document.getElementById('boot');
          for (let i = bootIndex; i < bl.length; i++) {
            const line = document.createElement('div');

      const line = document.createElement('div');
      line.className = 'boot-line';
      line.textContent = bl[bootIndex];
      bootEl.appendChild(line);
      bootEl.scrollTop = bootEl.scrollHeight;
      if (bootIndex === 0) sndBeep(1000, 0.15);
      bootIndex++;
      setTimeout(displayBootLine, 60);
    }

    function skipBoot() {
      if (bootSkipped) return;
      bootSkipped = true;
    }

      const t = D.theme && D.theme.active;

    function startTerminal() {
      document.getElementById('boot').style.display = 'none';
      const term = document.getElementById('terminal');
      term.style.display = '';
      term.hidden = false;
      term.style.opacity = '0';

      printOutput('');
      const welcome = (D.terminal && D.terminal.welcomeMessage) || "Type 'help' for available commands.";

    function powerOn() {
      try { initAudio(); } catch(e) {}
      sndHum();
      sndZap();
      const screen = document.getElementById('screen');
      screen.classList.add('booting');

      setTimeout(() => {
        screen.classList.remove('booting');
        sndBeep(1000, 0.15);
        setTimeout(displayBootLine, 300);
      }, 500);

    document.addEventListener('keydown', (e) => {
      if (!bootSkipped && document.getElementById('boot').style.display !== 'none') {
        skipBoot();
        try { initAudio(); } catch(x) {}

      const boot = document.getElementById('boot');
      const term = document.getElementById('terminal');
      if (!bootSkipped && boot.style.display !== 'none') {
        skipBoot();
        try { initAudio(); } catch(x) {}
        return;

      if (term && !term.hidden && term.style.display !== 'none') {
        const isWin = e.target.closest('.w98');
        const isBar = e.target.closest('#quickbar');
        const isInput = e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA';

    // ============ OUTPUT HELPERS ============
    const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    function scrollT() {
      const t = document.getElementById('terminal');
      t.scrollTo({ top: t.scrollHeight, behavior: 'smooth' });
    }

    function printOutput(text) {

    }

    function addLine(text, cls) {
      const el = document.createElement('div');
      el.className = 'tl' + (cls ? ' ' + cls : '');
      el.textContent = text || '\u00A0';
      document.getElementById('output').appendChild(el);
      scrollT();
    }

    function addHTML(html) {
      const el = document.createElement('div');
      el.innerHTML = html;
      document.getElementById('output').appendChild(el);
      scrollT();
    }

    function getPrompt() {
      return (D.terminal && D.terminal.prompt) || 'C:\\Users\\shrey> ';
    }
    function addPromptLine(cmd) {
      const el = document.createElement('div');
      el.className = 'tl';
      el.innerHTML = '<span style="color:var(--bright)">' + esc(getPrompt()) + '</span>' + esc(cmd);
      document.getElementById('output').appendChild(el);
      scrollT();
    }

    async function typeLinesSlow(lines, spd) {
      spd = spd || 8;
      for (const line of lines) {
        const cls = (typeof line === 'object') ? line.c : '';
        const text = (typeof line === 'object') ? line.t : line;
        const el = document.createElement('div');
        el.className = 'tl' + (cls ? ' ' + cls : '');
        document.getElementById('output').appendChild(el);
        for (let i = 0; i < text.length; i++) {
          el.textContent += text[i];
          if (i % 3 === 0) sndType();
          scrollT();
          await new Promise(r => setTimeout(r, spd));
        }
        if (!text) el.textContent = '\u00A0';
      }
    }

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    function tilt(e, el) {
      const r = el.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5;
      const y = (e.clientY - r.top) / r.height - 0.5;
      el.style.transform = 'perspective(800px) rotateY(' + (x*4) + 'deg) rotateX(' + (-y*4) + 'deg) scale(1.01)';
    }

    function untilt(el) { el.style.transform = ''; }

    // ============ TERMINAL COMMANDS ============

          let ti = tabs.indexOf(paletteTab);

    function makeWindowDraggable(el) {
      let offsetX = 0, offsetY = 0;

      titleBar.addEventListener('mousedown', (e) => {
        el.style.zIndex = ++zIndex;
        offsetX = e.clientX - el.offsetLeft;
        offsetY = e.clientY - el.offsetTop;

        function moveWindow(e) {
          el.style.left = (e.clientX - offsetX) + 'px';
          el.style.top = (e.clientY - offsetY) + 'px';
        }

        function stopMove() {
          document.removeEventListener('mousemove', moveWindow);
          document.removeEventListener('mouseup', stopMove);
        }

        document.addEventListener('mousemove', moveWindow);
        document.addEventListener('mouseup', stopMove);
      });
    }

    function startResize(e, id) {
      e.preventDefault();
      const win = document.getElementById(id);
      const startX = e.clientX;
      const startY = e.clientY;
      const startW = win.offsetWidth;
      const startH = win.offsetHeight;

      function doResize(e) {
        const dw = e.clientX - startX;
        const dh = e.clientY - startY;
        win.style.width = Math.max(300, startW + dw) + 'px';
        win.style.height = Math.max(200, startH + dh) + 'px';
      }

      function stopResize() {
        document.removeEventListener('mousemove', doResize);
        document.removeEventListener('mouseup', stopResize);
      }

      document.addEventListener('mousemove', doResize);
      document.addEventListener('mouseup', stopResize);
    }

      renderExplorerFiles(win.querySelector('[data-files]'), 'C:\\Users\\shrey');
    }

    const funnyFiles = {
      'readme.txt': "=== README.txt ===\n\nHey! You found the secret file.\n\nFun facts about this portfolio:\n- Built entirely in one HTML file\n- The boot sequence is fake (sorry)\n- No actual files were harmed\n- This terminal runs on vibes\n- The paint app actually works tho\n\nThanks for visiting!\n\n- Shrey",
      'todo.txt': "=== TODO ===\n\n[x] Build portfolio\n[x] Make it look cool\n[x] Add easter eggs\n[ ] Get hired\n[ ] Touch grass\n[ ] Sleep",
      'resume.pdf': "ERROR: Cannot render PDF in Notepad.\n\nBut nice try! Check out the real\nportfolio by typing 'browse' in\nthe terminal.",
      'cover_letter.docx': "Dear Hiring Manager,\n\nI am writing to express my\ninterest in the position of\n\"Person Who Gets Paid.\"\n\nI am qualified because I built\nthis entire terminal in HTML.\n\nSincerely,\nShrey",
    };

    function renderExplorerFiles(container, path) {
      const dir = explorerFS[path] || { folders: [], files: [] };
      let html = '';
      dir.folders.forEach(f => { html += '<div class="explorer-item" style="padding:3px 6px;">&#128193; ' + f + '</div>'; });
      dir.files.forEach(f => {
        html += '<div class="explorer-item" style="padding:3px 6px;cursor:pointer;" ondblclick="openFileInNotepad(\'' + f.replace(/'/g,"\\'") + '\')">&#128196; ' + f + '</div>';
      });
      if (!dir.folders.length && !dir.files.length) html = '<div style="padding:8px;color:#888;">(empty)</div>';
      container.innerHTML = html;
    }

    function openFileInNotepad(filename) {
      const content = funnyFiles[filename] || 'This file is empty.\n\n(But you clicked it, so that\'s something.)';
      const id = spawnWin(filename + ' - Notepad',
        '<div class="notepad-menu" style="background:#c0c0c0;padding:0 2px;border-bottom:1px solid #808080;display:flex;gap:0;font-family:Tahoma,Arial,sans-serif;font-size:11px;">' +
          '<div class="nm-item"><u>F</u>ile</div>' +
          '<div class="nm-item"><u>E</u>dit</div>' +
          '<div class="nm-item"><u>H</u>elp</div>' +
        '</div>' +
        '<textarea class="notepad-textarea" spellcheck="false" style="flex:1;width:100%;border:none;outline:none;resize:none;font-family:\'Courier New\',monospace;font-size:13px;padding:4px;">' + content.replace(/</g,'&lt;') + '</textarea>',
        420, 340
      );
    }

    // ============ SNAKE ============
    function spawnSnake() {
      spawnCount++;
      const off = ((spawnCount - 1) % 8) * 28;
      const winId = 'dw-' + Date.now();
      const win = document.createElement('div');
      win.className = 'w98'; win.id = winId;
      win.style.cssText = 'display:flex;width:310px;height:370px;left:'+(60+off)+'px;top:'+(40+off)+'px;z-index:'+(++zIndex)+';';
      win.innerHTML = '<div class="w98-title"><div class="w98-title-text">Snake - Score: 0</div><div class="w98-close">X</div></div>' +
        '<div class="w98-content" style="display:flex;flex-direction:column;align-items:center;background:#000;padding:8px;">' +
        '<canvas width="280" height="280" style="border:2px solid #808080;"></canvas>' +
        '<div style="color:#33ff33;font-size:10px;margin-top:4px;font-family:Tahoma,sans-serif;">WASD/Arrows | Wraps around edges</div></div>';
      document.body.appendChild(win);
      makeWindowDraggable(win);
      const canvas = win.querySelector('canvas'), ctx = canvas.getContext('2d');
      const C = 14, W = 20, H = 20;
      let snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
      let dir = {x:1,y:0}, ndir = {x:1,y:0}, food, score = 0, alive = true, loop, speed = 140;
      function pf() { let f; do { f = {x:Math.floor(Math.random()*W),y:Math.floor(Math.random()*H)}; } while (snake.some(s=>s.x===f.x&&s.y===f.y)); food = f; }
      function draw() {
        ctx.fillStyle = '#000'; ctx.fillRect(0,0,280,280);
        ctx.fillStyle = '#33ff33'; snake.forEach(s => ctx.fillRect(s.x*C+1,s.y*C+1,C-2,C-2));
        ctx.fillStyle = '#ff3333'; ctx.fillRect(food.x*C+1,food.y*C+1,C-2,C-2);
      }
      function step() {
        if (!alive) return;
        dir = ndir;
        const h = {x:(snake[0].x+dir.x+W)%W, y:(snake[0].y+dir.y+H)%H};
        if (snake.some(s=>s.x===h.x&&s.y===h.y)) {
          alive = false; ctx.fillStyle='rgba(255,0,0,0.3)'; ctx.fillRect(0,0,280,280);
          ctx.fillStyle='#fff'; ctx.font='18px VT323'; ctx.textAlign='center';
          ctx.fillText('GAME OVER',140,130); ctx.fillText('Score: '+score,140,155); return;
        }
        snake.unshift(h);
        if (h.x===food.x&&h.y===food.y) {
          score++; win.querySelector('.w98-title-text').textContent='Snake - Score: '+score; pf();
          if (score <= 5) { clearInterval(loop); speed = Math.max(70, 140 - score * 14); loop = setInterval(step, speed); }
        } else snake.pop();
        draw();
      }
      const kh = e => {
        if (!alive) return;
        const m = {ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}};
        const nd = m[e.key]; if (nd&&!(nd.x===-dir.x&&nd.y===-dir.y)) { ndir=nd; e.preventDefault(); }
        if (e.ctrlKey&&e.key==='c') cleanup();
      };
      function cleanup() { alive=false; clearInterval(loop); document.removeEventListener('keydown',kh); closeWindow(winId); }
      win.querySelector('.w98-close').onclick = cleanup;
      document.addEventListener('keydown', kh);
      pf(); draw(); loop = setInterval(step, speed);
    }

    // ============ TETRIS ============
    function spawnTetris() {
      spawnCount++;
      const off = ((spawnCount - 1) % 8) * 28;
      const winId = 'dw-' + Date.now();
      const win = document.createElement('div');
      win.className = 'w98'; win.id = winId;
      const CW = 250, CH = 500, CS = 25, COLS = 10, ROWS = 20;
      win.style.cssText = 'display:flex;width:360px;height:560px;left:'+(80+off)+'px;top:'+(20+off)+'px;z-index:'+(++zIndex)+';';
      win.innerHTML = '<div class="w98-title"><div class="w98-title-text">Tetris - Score: 0</div><div class="w98-close">X</div></div>' +
        '<div class="w98-content" style="display:flex;background:#000;padding:8px;gap:8px;">' +
        '<canvas width="'+CW+'" height="'+CH+'" style="border:2px solid #808080;flex-shrink:0;"></canvas>' +
        '<div style="color:#33ff33;font-family:VT323,monospace;font-size:16px;width:80px;">' +
          '<div>HOLD</div><canvas class="hold-cv" width="80" height="80" style="border:1px solid #333;margin:4px 0 12px;"></canvas>' +
          '<div>SCORE</div><div class="t-score" style="font-size:20px;margin:4px 0 12px;">0</div>' +
          '<div style="font-size:12px;margin-top:16px;color:#0a6b0a;">Arrows move<br>Up rotate<br>Space drop<br>C hold</div>' +
        '</div></div>';
      document.body.appendChild(win);
      makeWindowDraggable(win);
      const canvas = win.querySelector('canvas'), ctx = canvas.getContext('2d');
      const holdCv = win.querySelector('.hold-cv'), holdCtx = holdCv.getContext('2d');
      const SHAPES = [
        {s:[[1,1,1,1]],c:'#0ff'}, {s:[[1,1],[1,1]],c:'#ff0'}, {s:[[0,1,0],[1,1,1]],c:'#a0f'},
        {s:[[0,1,1],[1,1,0]],c:'#0f0'}, {s:[[1,1,0],[0,1,1]],c:'#f00'}, {s:[[1,0,0],[1,1,1]],c:'#00f'}, {s:[[0,0,1],[1,1,1]],c:'#f80'}
      ];
      let board = Array.from({length:ROWS},()=>Array(COLS).fill(0));
      let cur, hold = null, canHold = true, score = 0, alive = true, loop;
      function np() { const p = SHAPES[Math.floor(Math.random()*SHAPES.length)]; cur = {s:p.s.map(r=>[...r]),c:p.c,x:3,y:0}; canHold = true; }
      function ok(s,ox,oy) { return s.every((row,dy)=>row.every((c,dx)=>!c||(cur.x+dx+ox>=0&&cur.x+dx+ox<COLS&&cur.y+dy+oy>=0&&cur.y+dy+oy<ROWS&&!board[cur.y+dy+oy][cur.x+dx+ox]))); }
      function doHold() {
        if (!canHold) return;
        canHold = false;
        if (hold) { const tmp = hold; hold = {s:cur.s,c:cur.c}; cur = {s:tmp.s.map(r=>[...r]),c:tmp.c,x:3,y:0}; }
        else { hold = {s:cur.s,c:cur.c}; np(); }
        drawHold();
      }
      function drawHold() {
        holdCtx.fillStyle = '#000'; holdCtx.fillRect(0,0,80,80);
        if (hold) { holdCtx.fillStyle = hold.c; hold.s.forEach((row,dy)=>row.forEach((c,dx)=>{ if(c) holdCtx.fillRect(dx*16+8,dy*16+8,14,14); })); }
      }
      function place() {
        cur.s.forEach((row,dy)=>row.forEach((c,dx)=>{ if(c) board[cur.y+dy][cur.x+dx]=cur.c; }));
        let lines=0;
        for(let r=ROWS-1;r>=0;r--) { if(board[r].every(c=>c)) { board.splice(r,1); board.unshift(Array(COLS).fill(0)); lines++; r++; } }
        score += [0,100,300,500,800][lines]||0;
        win.querySelector('.t-score').textContent = score;
        np(); if(!ok(cur.s,0,0)) { alive=false; ctx.fillStyle='rgba(255,0,0,0.3)'; ctx.fillRect(0,0,CW,CH); ctx.fillStyle='#fff'; ctx.font='20px VT323'; ctx.textAlign='center'; ctx.fillText('GAME OVER',CW/2,CH/2-10); ctx.fillText('Score: '+score,CW/2,CH/2+15); }
      }
      function draw() {
        ctx.fillStyle='#000'; ctx.fillRect(0,0,CW,CH);
        // Grid lines
        ctx.strokeStyle='#111';
        for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*CS,0);ctx.lineTo(x*CS,CH);ctx.stroke();}
        for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*CS);ctx.lineTo(CW,y*CS);ctx.stroke();}
        board.forEach((row,r)=>row.forEach((c,cl)=>{ if(c){ctx.fillStyle=c;ctx.fillRect(cl*CS+1,r*CS+1,CS-2,CS-2);} }));
        if(cur) { ctx.fillStyle=cur.c; cur.s.forEach((row,dy)=>row.forEach((c,dx)=>{ if(c) ctx.fillRect((cur.x+dx)*CS+1,(cur.y+dy)*CS+1,CS-2,CS-2); })); }
      }
      function step() { if(!alive) return; if(ok(cur.s,0,1)) cur.y++; else place(); draw(); win.querySelector('.w98-title-text').textContent='Tetris - Score: '+score; }
      const kh = e => {
        if(!alive||!cur) return;
        if(e.key==='ArrowLeft'&&ok(cur.s,-1,0)){cur.x--;draw();e.preventDefault();}
        if(e.key==='ArrowRight'&&ok(cur.s,1,0)){cur.x++;draw();e.preventDefault();}
        if(e.key==='ArrowDown'&&ok(cur.s,0,1)){cur.y++;draw();e.preventDefault();}
        if(e.key==='ArrowUp'){const rot=cur.s[0].map((_,c)=>cur.s.map(r=>r[c]).reverse());const os=cur.s;cur.s=rot;if(!ok(cur.s,0,0))cur.s=os;else draw();e.preventDefault();}
        if(e.key===' '){while(ok(cur.s,0,1))cur.y++;place();draw();e.preventDefault();}
        if(e.key==='c'&&!e.ctrlKey) doHold();
        if(e.ctrlKey&&e.key==='c') cleanup();
      };
      function cleanup() { alive=false; clearInterval(loop); document.removeEventListener('keydown',kh); closeWindow(winId); }
      win.querySelector('.w98-close').onclick = cleanup;
      document.addEventListener('keydown', kh);
      np(); draw(); drawHold(); loop = setInterval(step, 500);
    }

    // ============ MINESWEEPER ============
    function spawnMinesweeper() {
      spawnCount++;
      const off = ((spawnCount - 1) % 8) * 28;
      const winId = 'dw-' + Date.now();
      const COLS = 9, ROWS = 9, MINES = 10, CS = 28;
      const W = COLS * CS, H = ROWS * CS;
      const win = document.createElement('div');
      win.className = 'w98'; win.id = winId;
      win.style.cssText = 'display:flex;width:'+(W+24)+'px;height:'+(H+90)+'px;left:'+(60+off)+'px;top:'+(40+off)+'px;z-index:'+(++zIndex)+';';
      win.innerHTML = '<div class="w98-title"><div class="w98-title-text">Minesweeper</div><div class="w98-close" onclick="closeWindow(\''+winId+'\')">X</div></div>' +
        '<div class="w98-content" style="display:flex;flex-direction:column;align-items:center;padding:8px;background:#c0c0c0;">' +
        '<div style="margin-bottom:4px;font-family:VT323;font-size:16px;color:#f00;" class="ms-status">Mines: '+MINES+'</div>' +
        '<canvas width="'+W+'" height="'+H+'" style="border:3px solid;border-color:#808080 #fff #fff #808080;cursor:pointer;"></canvas></div>';
      document.body.appendChild(win);
      makeWindowDraggable(win);
      const canvas = win.querySelector('canvas'), ctx = canvas.getContext('2d');
      let grid = [], revealed = [], flagged = [], alive = true, won = false, first = true;
      const NUMCOL = ['','#00f','#080','#f00','#008','#800','#088','#000','#888'];
      function init(sx,sy) {
        grid = Array.from({length:ROWS},()=>Array(COLS).fill(0));
        revealed = Array.from({length:ROWS},()=>Array(COLS).fill(false));
        flagged = Array.from({length:ROWS},()=>Array(COLS).fill(false));
        let placed = 0;
        while(placed < MINES) {
          const r = Math.floor(Math.random()*ROWS), c = Math.floor(Math.random()*COLS);
          if (grid[r][c]===-1||(r===sy&&c===sx)) continue;
          grid[r][c] = -1; placed++;
        }
        for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) {
          if(grid[r][c]===-1) continue;
          let n=0;
          for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++) { const nr=r+dr,nc=c+dc; if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&grid[nr][nc]===-1) n++; }
          grid[r][c]=n;
        }
      }
      function reveal(r,c) {
        if(r<0||r>=ROWS||c<0||c>=COLS||revealed[r][c]||flagged[r][c]) return;
        revealed[r][c]=true;
        if(grid[r][c]===0) { for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++) reveal(r+dr,c+dc); }
      }
      function checkWin() {
        let unrev = 0;
        for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(!revealed[r][c]) unrev++;
        if(unrev===MINES) { won=true; alive=false; win.querySelector('.ms-status').textContent='YOU WIN!'; win.querySelector('.ms-status').style.color='#0f0'; }
      }
      function draw() {
        for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) {
          const x=c*CS, y=r*CS;
          if(revealed[r][c]) {
            ctx.fillStyle='#c0c0c0'; ctx.fillRect(x,y,CS,CS);
            ctx.strokeStyle='#808080'; ctx.strokeRect(x,y,CS,CS);
            if(grid[r][c]===-1) { ctx.fillStyle='#f00'; ctx.fillRect(x+6,y+6,CS-12,CS-12); }
            else if(grid[r][c]>0) { ctx.fillStyle=NUMCOL[grid[r][c]]; ctx.font='bold 16px VT323'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(grid[r][c],x+CS/2,y+CS/2); }
          } else {
            ctx.fillStyle='#c0c0c0'; ctx.fillRect(x,y,CS,CS);
            ctx.fillStyle='#dfdfdf'; ctx.fillRect(x,y,CS-1,1); ctx.fillRect(x,y,1,CS-1);
            ctx.fillStyle='#808080'; ctx.fillRect(x+CS-1,y,1,CS); ctx.fillRect(x,y+CS-1,CS,1);
            if(flagged[r][c]) { ctx.fillStyle='#f00'; ctx.font='14px VT323'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('F',x+CS/2,y+CS/2); }
          }
        }
      }
      canvas.addEventListener('click', e => {
        if(!alive) return;
        const rect = canvas.getBoundingClientRect();
        const c = Math.floor((e.clientX-rect.left)/CS), r = Math.floor((e.clientY-rect.top)/CS);
        if(c<0||c>=COLS||r<0||r>=ROWS||flagged[r][c]) return;
        if(first) { init(c,r); first=false; }
        if(grid[r][c]===-1) { alive=false; for(let rr=0;rr<ROWS;rr++) for(let cc=0;cc<COLS;cc++) revealed[rr][cc]=true; draw(); win.querySelector('.ms-status').textContent='BOOM!'; return; }
        reveal(r,c); draw(); checkWin();
      });
      canvas.addEventListener('contextmenu', e => {
        e.preventDefault(); if(!alive||first) return;
        const rect = canvas.getBoundingClientRect();
        const c = Math.floor((e.clientX-rect.left)/CS), r = Math.floor((e.clientY-rect.top)/CS);
        if(c<0||c>=COLS||r<0||r>=ROWS||revealed[r][c]) return;
        flagged[r][c] = !flagged[r][c]; draw();
        let flags = 0; flagged.forEach(row=>row.forEach(f=>{if(f)flags++;}));
        win.querySelector('.ms-status').textContent = 'Mines: '+(MINES-flags);
      });
      draw();
    }
