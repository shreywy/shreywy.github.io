<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shrey Mistry - PM @ Geotab | CS Student | Builder of things">
  <meta name="author" content="Shrey Mistry">
  <title>Shrey Mistry - CRT Portfolio Terminal</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=DM+Sans:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --text: #33ff33;
      --bg: #001a00;
      --dim: #0a6b0a;
      --bright: #66ff66;
      --accent: #00cc00;
    }

    [data-color="amber"] {
      --text: #ffaa00;
      --bg: #1a0f00;
      --dim: #664400;
      --bright: #ffdd00;
      --accent: #ff9900;
    }

    [data-color="blue"] {
      --text: #00aaff;
      --bg: #000a1a;
      --dim: #004466;
      --bright: #00ddff;
      --accent: #0088ff;
    }

    /* ============ FULLSCREEN CRT SCREEN ============ */
    html, body { height: 100%; }
    body {
      background: #000;
      color: var(--text);
      font-family: 'VT323', monospace;
      font-size: 1.15rem;
      line-height: 1.5;
      overflow: hidden;
      text-shadow: 0 0 4px rgba(51,255,51,0.35), -0.5px 0 rgba(255,50,50,0.05), 0.5px 0 rgba(50,50,255,0.05);
    }

    /* CRT Screen container */
    #screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      border-radius: 14px;
      overflow: hidden;
      background: var(--bg);
      box-shadow: inset 0 0 80px rgba(0,0,0,0.4), inset 0 0 120px rgba(51,255,51,0.06);
    }

    /* Subtle CRT flicker */
    @keyframes crtFlicker {
      0%, 94%, 100% { opacity: 1; }
      95% { opacity: 0.97; }
      97% { opacity: 0.99; }
      98% { opacity: 0.96; }
    }
    #screen { animation: crtFlicker 8s infinite; }

    /* CRT Scanlines overlay */
    #screen::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15),
        rgba(0, 0, 0, 0.15) 2px,
        transparent 2px,
        transparent 4px
      );
      z-index: 10;
    }

    /* CRT Vignette overlay */
    #screen::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 0%, rgba(0, 0, 0, 0.4) 100%);
      z-index: 11;
    }

    /* Content wrapper (below overlays) */
    #content {
      flex: 1;
      overflow: hidden;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* ============ BOOT SEQUENCE ============ */
    #boot {
      flex: 1;
      min-height: 0;
      padding: 20px;
      overflow-y: auto;
    }

    .boot-line { white-space: pre-wrap; }

    /* Power-on flicker */
    @keyframes flickerBoot {
      0% { opacity: 1; }
      25% { opacity: 0.2; }
      50% { opacity: 0.8; }
      75% { opacity: 0.1; }
      100% { opacity: 1; }
    }
    #screen.booting { animation: flickerBoot 0.08s 6; }

    /* ============ TERMINAL ============ */
    #terminal {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      scroll-behavior: smooth;
      padding: 20px;
      padding-bottom: 60px;
    }
    #terminal[hidden] { display: none; }

    #terminal::-webkit-scrollbar { width: 4px; }
    #terminal::-webkit-scrollbar-track { background: transparent; }
    #terminal::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }

    #output { }

    .tl { white-space: pre-wrap; word-break: break-word; }
    .tl.b { color: var(--bright); text-shadow: 0 0 8px rgba(51,255,51,0.4); }
    .tl.d { color: var(--dim); }
    .tl.a { color: var(--accent); }

    #inputRow {
      display: flex;
      align-items: baseline;
    }

    #prompt {
      color: var(--bright);
      user-select: none;
      white-space: pre;
    }

    #input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font: inherit;
      outline: none;
      caret-color: var(--text);
      padding: 0;
      margin: 0;
    }

    /* ============ EXPERIENCE / PROJECT CARDS ============ */
    .exp-timeline {
      position: relative;
      padding-left: 28px;
      margin: 8px 0;
    }
    .exp-timeline::before {
      content: '';
      position: absolute;
      left: 8px; top: 0; bottom: 0;
      width: 2px;
      background: var(--dim);
    }
    .exp-card {
      border: 1px solid var(--dim); border-radius: 4px;
      padding: 12px 14px; background: rgba(255,255,255,0.015);
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.4s;
      opacity: 0; transform: translateY(12px);
      cursor: default; position: relative;
      margin-bottom: 8px;
    }
    .exp-timeline .exp-card::before {
      content: '';
      position: absolute;
      left: -24px; top: 16px;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg);
      z-index: 1;
    }
    .exp-card.show { opacity: 1; transform: translateY(0); }
    .exp-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.3), 0 0 10px rgba(51,255,51,0.15); }
    .proj-cards { margin: 8px 0; }
    .ec-t { color: var(--bright); }
    .ec-c { color: var(--accent); }
    .ec-p { color: var(--dim); font-size: 0.95rem; }
    .ec-d { color: var(--text); opacity: 0.7; margin-top: 4px; }
    .ec-s { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .ec-sk { font-size: 0.9rem; padding: 1px 8px; border: 1px solid var(--dim); color: var(--dim); }
    .pc-link {
      font-family: 'VT323'; font-size: 0.95rem; padding: 2px 10px;
      border: 1px solid var(--dim); color: var(--accent);
      background: transparent; cursor: pointer; text-decoration: none;
      display: inline-block; margin-top: 6px;
    }
    .pc-link:hover { background: rgba(255,255,255,0.04); color: var(--bright); border-color: var(--accent); }

    /* ============ NEOFETCH ============ */
    .neofetch-wrap {
      display: flex;
      gap: 20px;
      margin: 4px 0;
      align-items: flex-start;
    }
    .nf-logo-pre {
      color: var(--bright);
      text-shadow: 0 0 8px rgba(51,255,51,0.4);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      line-height: 1.3;
      white-space: pre;
      flex-shrink: 0;
    }
    .nf-info-col { flex: 1; }
    .nf-info-col div { white-space: pre; }
    .nf-key { color: var(--accent); }
    .nf-val { color: var(--text); }
    .nf-sep { color: var(--dim); }

    /* ============ COMMAND PALETTE ============ */
    #commandPalette {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--bg);
      border: 2px solid var(--text);
      border-radius: 4px;
      z-index: 100;
      max-width: 500px;
      max-height: 400px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(51, 255, 51, 0.3);
    }

    .palette-item {
      padding: 8px 12px;
      color: var(--text);
      cursor: pointer;
      border-bottom: 1px solid var(--dim);
    }

    .palette-item.selected {
      background: var(--bright);
      color: var(--bg);
    }

    .palette-item:last-child {
      border-bottom: none;
    }

    /* ============ QUICKBAR (TASKBAR) ============ */
    #quickbar {
      background: var(--bg);
      border-top: 1px solid var(--dim);
      padding: 10px 16px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      z-index: 60;
      position: relative;
    }
    #content.split ~ #quickbar {
      padding: 6px 10px;
      gap: 3px;
    }
    #content.split ~ #quickbar .quickbar-btn {
      padding: 2px 8px;
      font-size: 0.9rem;
    }

    .quickbar-btn {
      background: transparent;
      border: 1px solid var(--dim);
      color: var(--text);
      padding: 4px 12px;
      font: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }

    .quickbar-btn:hover {
      color: var(--bright);
      background: rgba(255,255,255,0.04);
      border-color: var(--text);
    }

    .quickbar-btn:active {
      transform: scale(0.95);
    }

    /* ============ WIN98 WINDOW SYSTEM ============ */
    .w98 {
      position: absolute;
      background: #c0c0c0;
      border: 2px solid;
      border-color: #dfdfdf #404040 #404040 #dfdfdf;
      box-shadow: 1px 1px 0 #000, inset 1px 1px 0 #fff;
      display: flex;
      flex-direction: column;
      min-width: 300px;
      min-height: 200px;
      z-index: 50;
    }

    .w98.closing {
      animation: winClose 0.25s ease-in forwards;
      pointer-events: none;
    }

    @keyframes winClose {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0.05); opacity: 0; }
    }

    .w98-title {
      background: linear-gradient(90deg, #000080, #1084d0);
      color: white;
      padding: 2px 3px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      cursor: move;
      font-family: Tahoma, 'MS Sans Serif', Arial, sans-serif;
      font-size: 11px;
      font-weight: bold;
    }

    .w98-title-text {
      flex: 1;
      padding: 2px 4px;
    }

    .w98-close {
      width: 16px;
      height: 14px;
      background: #c0c0c0;
      border: 1px solid;
      border-color: #dfdfdf #404040 #404040 #dfdfdf;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 9px;
      font-weight: bold;
      color: #000;
      font-family: Tahoma, sans-serif;
      margin: 2px;
    }

    .w98-close:active {
      border-color: #404040 #dfdfdf #dfdfdf #404040;
      padding: 1px 0 0 1px;
    }

    .w98-content {
      flex: 1;
      overflow: auto;
      background: #c0c0c0;
      padding: 4px;
    }

    .w98-resize {
      width: 16px;
      height: 16px;
      background: linear-gradient(135deg, white 0%, white 50%, #808080 50%, #808080 100%);
      cursor: nwse-resize;
      position: absolute;
      bottom: 0;
      right: 0;
    }

    /* ============ BROWSER WINDOW ============ */
    #browserWindow {
      display: none;
      position: fixed;
      top: 0; right: 0; bottom: 48px;
      width: 50%;
      height: auto;
      border-radius: 0 14px 0 0;
      z-index: 55;
    }
    #content.split { margin-right: 50%; }
    @media (max-width: 900px) {
      #browserWindow { width: 100%; bottom: 48px; border-radius: 0; }
      #content.split { margin-right: 0; }
    }

    .browser-toolbar {
      background: #c0c0c0;
      padding: 4px;
      display: flex;
      gap: 4px;
      align-items: center;
      border-bottom: 2px inset #c0c0c0;
    }

    .browser-btn {
      width: 22px;
      height: 22px;
      background: #c0c0c0;
      border: 2px outset #dfdfdf;
      border-left-color: white;
      border-top-color: white;
      border-right-color: #808080;
      border-bottom-color: #808080;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    }

    .browser-btn:active {
      border-style: inset;
    }

    .browser-address {
      flex: 1;
      background: white;
      padding: 2px 4px;
      border: 2px inset;
      border-color: #808080 white white #808080;
      font-family: 'MS Sans Serif', Arial, sans-serif;
      font-size: 12px;
      color: black;
    }

    .browser-tabs {
      background: #c0c0c0;
      display: flex;
      gap: 2px;
      padding: 4px;
      border-bottom: 1px solid #808080;
    }

    .browser-tab {
      background: #dfdfdf;
      border: 2px outset;
      border-color: white #808080 #808080 white;
      padding: 4px 8px;
      cursor: pointer;
      font-family: 'MS Sans Serif', Arial, sans-serif;
      font-size: 12px;
      color: black;
    }

    .browser-tab.active {
      background: #c0c0c0;
      border-style: inset;
    }

    .browser-content {
      background: white;
      overflow: auto;
    }

    /* ============ PORTFOLIO PAGE (inside browser) ============ */
    .portfolio-page {
      background: #f5f0e8;
      color: #333;
      font-family: 'Times New Roman', Georgia, serif;
      font-size: 14px;
      line-height: 1.7;
      padding: 30px 40px;
      min-height: 100%;
    }
    .portfolio-page h1 {
      font-size: 28px;
      margin: 0 0 4px;
      color: #1a1a1a;
    }
    .portfolio-page .pp-tagline {
      font-size: 13px;
      color: #666;
      margin-bottom: 16px;
    }
    .portfolio-page hr {
      border: none;
      border-top: 1px solid #999;
      margin: 16px 0;
    }
    .portfolio-page h2 {
      font-size: 18px;
      margin: 20px 0 10px;
      color: #1a1a1a;
      border-bottom: 1px solid #ccc;
      padding-bottom: 4px;
    }
    .portfolio-page .pp-exp {
      margin-bottom: 14px;
    }
    .portfolio-page .pp-exp-title {
      font-weight: bold;
      font-size: 14px;
    }
    .portfolio-page .pp-exp-co {
      font-style: italic;
      color: #555;
      font-size: 13px;
    }
    .portfolio-page .pp-exp-desc {
      font-size: 13px;
      color: #444;
      margin-top: 2px;
    }
    .portfolio-page .pp-skills {
      font-size: 13px;
      color: #444;
      margin-top: 2px;
    }
    .portfolio-page .pp-skill-tag {
      display: inline;
      font-size: 12px;
    }
    .portfolio-page .pp-contact {
      margin-top: 16px;
      font-size: 13px;
    }
    .portfolio-page .pp-contact a {
      color: #0000cc;
      text-decoration: underline;
    }
    .portfolio-page .pp-footer {
      margin-top: 24px;
      font-size: 11px;
      color: #999;
      text-align: center;
    }

    /* ============ PAINT WINDOW ============ */
    #paintWindow {
      display: none;
      width: 600px;
      height: 500px;
      left: 50px;
      top: 50px;
    }

    .paint-toolbar {
      background: #c0c0c0;
      padding: 4px;
      border-bottom: 2px inset;
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .paint-tool {
      width: 26px;
      height: 26px;
      background: #c0c0c0;
      border: 2px outset;
      border-color: white #808080 #808080 white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      user-select: none;
    }

    .paint-tool.active {
      border-style: inset;
    }

    .paint-tool:active {
      border-style: inset;
    }

    .paint-colors {
      display: flex;
      gap: 2px;
      padding: 4px;
      background: #c0c0c0;
      border-bottom: 2px inset;
      flex-wrap: wrap;
    }

    .paint-color {
      width: 16px;
      height: 16px;
      border: 2px outset;
      cursor: pointer;
    }

    .paint-color.selected {
      border-style: inset;
    }

    .paint-canvas {
      flex: 1;
      background: white;
      cursor: crosshair;
      margin: 4px;
      border: 2px solid;
      border-color: #808080 #dfdfdf #dfdfdf #808080;
    }

    /* ============ FILE EXPLORER ============ */
    #explorerWindow {
      display: none;
      width: 700px;
      height: 500px;
      left: 100px;
      top: 100px;
    }

    .explorer-toolbar {
      background: #c0c0c0;
      padding: 4px;
      border-bottom: 2px inset;
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .explorer-address {
      flex: 1;
      background: white;
      padding: 2px 4px;
      border: 2px inset;
      border-color: #808080 white white #808080;
      font-family: 'MS Sans Serif', Arial, sans-serif;
      font-size: 12px;
      color: black;
      cursor: text;
    }

    .explorer-split {
      display: flex;
      flex: 1;
      gap: 4px;
    }

    .explorer-panel {
      flex: 1;
      background: white;
      border: 2px inset;
      border-color: #808080 white white #808080;
      overflow: auto;
      font-family: 'MS Sans Serif', Arial, sans-serif;
      font-size: 12px;
      color: black;
    }

    .explorer-item {
      padding: 4px 4px;
      cursor: pointer;
      user-select: none;
    }

    .explorer-item:hover {
      background: #000080;
      color: white;
    }

    .explorer-item-icon {
      display: inline-block;
      width: 16px;
      height: 16px;
      margin-right: 4px;
      vertical-align: middle;
    }

    /* ============ PAINT LEFT TOOLBAR ============ */
    .paint-tools-left {
      width: 36px;
      background: #c0c0c0;
      border-right: 1px solid #808080;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 4px 3px;
      flex-shrink: 0;
    }
    .paint-colors-bottom {
      display: flex;
      gap: 2px;
      padding: 3px 4px;
      background: #c0c0c0;
      border-top: 2px solid #dfdfdf;
      flex-wrap: wrap;
      align-items: center;
      flex-shrink: 0;
    }

    /* ============ NOTEPAD ============ */
    .notepad-menu {
      background: #c0c0c0;
      padding: 1px 4px;
      border-bottom: 1px solid #808080;
      font-family: Tahoma, 'MS Sans Serif', Arial, sans-serif;
      font-size: 11px;
      display: flex;
      gap: 0;
    }

    .notepad-menu span {
      cursor: pointer;
      padding: 2px 8px;
      position: relative;
    }
    .notepad-menu span:hover {
      background: #000080;
      color: #fff;
    }
    .notepad-menu span u { text-decoration: underline; }

    .notepad-textarea {
      flex: 1;
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      padding: 4px;
      background: #fff;
      color: #000;
    }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 768px) {
      body {
        font-size: 0.9rem;
      }

      #boot, #terminal {
        font-size: 0.85rem;
        padding: 10px;
      }

      .boot-line {
        font-size: 0.85rem;
      }

      .tl {
        font-size: 0.85rem;
      }

      #inputRow {
        padding: 8px 10px;
      }

      #prompt, #input, #cursor {
        font-size: 0.85rem;
      }

      #browserWindow {
        width: 95vw !important;
        height: 90vh !important;
        left: 2.5vw !important;
        top: 5vh !important;
      }

      #paintWindow {
        width: 95vw !important;
        height: 85vh !important;
        left: 2.5vw !important;
        top: 7.5vh !important;
      }

      #explorerWindow {
        width: 95vw !important;
        height: 85vh !important;
        left: 2.5vw !important;
        top: 7.5vh !important;
      }

      #quickbar {
        flex-wrap: wrap;
      }

      .quickbar-btn {
        font-size: 0.85rem;
        padding: 3px 6px;
      }
    }

    /* ============ TEXT STYLING ============ */
    .bright { color: var(--bright); }
    .dim { color: var(--dim); }
    .accent { color: var(--accent); }
  </style>
</head>
<body>
  <div id="screen">
    <div id="content">
      <div id="boot"></div>
      <div id="terminal" hidden>
        <div id="output"></div>
        <div id="inputRow">
          <span id="prompt">C:\Users\shrey&gt; </span>
          <input type="text" id="input" autocomplete="off" spellcheck="false">
        </div>
        <div id="commandPalette"></div>
      </div>
    </div>
    <div id="quickbar"></div>
  </div>

  <!-- Windows 98 - Browser -->
  <div id="browserWindow" class="w98">
    <div class="w98-title">
      <div class="w98-title-text">SHREY-Web</div>
      <div class="w98-close" onclick="closeWindow('browserWindow')">X</div>
    </div>
    <div class="w98-content">
      <div class="browser-toolbar">
        <div class="browser-address">file:///C:/www/portfolio/index.html</div>
      </div>
      <div class="browser-content" id="browserBody" style="overflow-y:auto;flex:1;"></div>
    </div>
    <div class="w98-resize" onmousedown="startResize(event, 'browserWindow')"></div>
  </div>

  <!-- Paint, Notepad, Explorer are spawned dynamically by JS -->

  <script>
    // ============ DATA ============
    let D = {
      "name": "Shrey Mistry",
      "tagline": "PM @ Geotab | CS Student | Builder of things",
      "location": "Greater Toronto Area, Canada",
      "email": "shrey.d.mistry@gmail.com",
      "linkedin": "https://linkedin.com/in/shreymistry",
      "github": "https://github.com/shreywy",
      "about": "Computer Science student at Toronto Metropolitan University. Done a few internships and always looking to broaden my horizons before graduation.",
      "skills": {
        "Languages": ["Python", "JavaScript", "TypeScript", "Java", "SQL"],
        "Frontend": ["React", "HTML/CSS"],
        "Backend": ["Flask", "Docker", "BigQuery"],
        "Tools": ["Jira", "Google Apps Script", "VBA", "Git"]
      },
      "experience": [
        {

    // ============ AUDIO ============
    let audioContext;
    function initAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function sndType() {
      try {
        if (!audioContext) initAudio();
        const o = audioContext.createOscillator(), g = audioContext.createGain();
        o.connect(g); g.connect(audioContext.destination);
        o.frequency.value = 800;
        g.gain.setValueAtTime(0.1, audioContext.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.05);
        o.start(audioContext.currentTime); o.stop(audioContext.currentTime + 0.05);
      } catch(e) {}
    }

    function sndBeep(freq, dur) {
      try {
        freq = freq || 1000; dur = dur || 0.1;
        if (!audioContext) initAudio();
        const o = audioContext.createOscillator(), g = audioContext.createGain();
        o.connect(g); g.connect(audioContext.destination);
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.3, audioContext.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + dur);
        o.start(audioContext.currentTime); o.stop(audioContext.currentTime + dur);
      } catch(e) {}
    }

    function sndZap() {
      try {
        if (!audioContext) initAudio();
        const buf = audioContext.createBuffer(1, audioContext.sampleRate * 0.1, audioContext.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        const s = audioContext.createBufferSource(), g = audioContext.createGain();
        s.buffer = buf; s.connect(g); g.connect(audioContext.destination);
        g.gain.setValueAtTime(0.3, audioContext.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
        s.start(audioContext.currentTime);
      } catch(e) {}
    }

    function sndHum() {
      try {
        if (!audioContext) initAudio();
        const o = audioContext.createOscillator(), g = audioContext.createGain();
        o.connect(g); g.connect(audioContext.destination);
        o.frequency.value = 60;
        g.gain.setValueAtTime(0.05, audioContext.currentTime);
        g.gain.exponentialRampToValueAtTime(0.02, audioContext.currentTime + 2);
        o.start(audioContext.currentTime); o.stop(audioContext.currentTime + 2);
      } catch(e) {}
    }

    function sndEnter() { sndBeep(1200, 0.08); }

    function sndBlip() {
      try {
        if (!audioContext) initAudio();
        const o = audioContext.createOscillator(), g = audioContext.createGain();
        o.connect(g); g.connect(audioContext.destination);
        o.frequency.setValueAtTime(400, audioContext.currentTime);
        o.frequency.exponentialRampToValueAtTime(600, audioContext.currentTime + 0.05);
        g.gain.setValueAtTime(0.1, audioContext.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.05);
        o.start(audioContext.currentTime); o.stop(audioContext.currentTime + 0.05);
      } catch(e) {}
    }

    async function typeLinesSlow(lines, spd) {
      spd = spd || 8;

        const el = document.createElement('div');

          await new Promise(r => setTimeout(r, spd));

      const y = (e.clientY - r.top) / r.height - 0.5;
      el.style.transform = 'perspective(800px) rotateY(' + (x*4) + 'deg) rotateX(' + (-y*4) + 'deg) scale(1.01)';

      }
      if (e.key === 'Enter') {
        const cmd = input.value;
        input.value = '';
        handleCommand(cmd);
      } else if (e.key === '/') {
        e.preventDefault();
        showCommandPalette();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        historyIndex = Math.min(historyIndex + 1, commandHistory.length - 1);
        input.value = historyIndex >= 0 ? commandHistory[commandHistory.length - 1 - historyIndex] : '';
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        historyIndex = Math.max(historyIndex - 1, -1);
        input.value = historyIndex >= 0 ? commandHistory[commandHistory.length - 1 - historyIndex] : '';
      }
    });

    // ============ COMMAND PALETTE ============
    const commands = {
      'about': true,
      'experience': true,
      'skills': true,
      'education': true,
      'projects': true,
      'contact': true,

    function showCommandPalette() {
      const palette = document.getElementById('commandPalette');
      const allCommands = Object.keys(commands);
      palette.innerHTML = '';
      allCommands.forEach((cmd, idx) => {
        const item = document.createElement('div');
        item.className = 'palette-item' + (idx === 0 ? ' selected' : '');
        item.textContent = cmd;
        item.onclick = () => selectCommand(cmd);
        palette.appendChild(item);
      });
      palette.style.display = 'block';

      let selectedIdx = 0;
      const handlePaletteKey = (e) => {
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          selectedIdx = (selectedIdx - 1 + allCommands.length) % allCommands.length;
          updatePaletteSelection(selectedIdx);
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          selectedIdx = (selectedIdx + 1) % allCommands.length;
          updatePaletteSelection(selectedIdx);
        } else if (e.key === 'Tab' || e.key === 'Enter') {
          e.preventDefault();
          selectCommand(allCommands[selectedIdx]);
        } else if (e.key === 'Escape') {
          e.preventDefault();
          closePalette();
          document.removeEventListener('keydown', handlePaletteKey);
        }
      };

      document.addEventListener('keydown', handlePaletteKey);
    }

    function updatePaletteSelection(idx) {
      document.querySelectorAll('.palette-item').forEach((el, i) => {
        el.classList.toggle('selected', i === idx);
      });
    }

    function selectCommand(cmd) {
      closePalette();
      input.value = '';
      handleCommand(cmd);
    }

    function closePalette() {
      document.getElementById('commandPalette').style.display = 'none';
    }

    // ============ WINDOW SYSTEM ============
    let windows = {};
    let zIndex = 50;

    function openWindow(id) {
      const win = document.getElementById(id);
      if (win) {
        win.style.display = 'flex';
        win.style.zIndex = ++zIndex;
        makeWindowDraggable(win);
      }
    }

    function closeWindow(id) {
      if (id === 'browserWindow') { closeBrowser(); return; }
      const win = document.getElementById(id);
      if (win) {
        win.classList.add('closing');
        setTimeout(() => {
          win.style.display = 'none';
          win.classList.remove('closing');
        }, 250);
      }
    }

    function openBrowser() {
      const bw = document.getElementById('browserWindow');
      bw.style.display = 'flex';
      bw.style.zIndex = ++zIndex;
      document.getElementById('content').classList.add('split');
      makeWindowDraggable(bw);
    }

    function closeBrowser() {
      const bw = document.getElementById('browserWindow');
      document.getElementById('content').classList.remove('split');
      bw.classList.add('closing');
      setTimeout(() => {
        bw.style.display = 'none';
        bw.classList.remove('closing');
      }, 250);
    }

    function makeWindowDraggable(el) {
      let offsetX = 0, offsetY = 0;
      const titleBar = el.querySelector('.w98-title');

      titleBar.addEventListener('mousedown', (e) => {
        el.style.zIndex = ++zIndex;
        offsetX = e.clientX - el.offsetLeft;
        offsetY = e.clientY - el.offsetTop;

        function moveWindow(e) {
          el.style.left = (e.clientX - offsetX) + 'px';
          el.style.top = (e.clientY - offsetY) + 'px';
        }

        function stopMove() {
          document.removeEventListener('mousemove', moveWindow);
          document.removeEventListener('mouseup', stopMove);
        }

        document.addEventListener('mousemove', moveWindow);
        document.addEventListener('mouseup', stopMove);
      });
    }

    function startResize(e, id) {
      e.preventDefault();
      const win = document.getElementById(id);
      const startX = e.clientX;
      const startY = e.clientY;
      const startW = win.offsetWidth;
      const startH = win.offsetHeight;

      function doResize(e) {
        const dw = e.clientX - startX;
        const dh = e.clientY - startY;
        win.style.width = Math.max(300, startW + dw) + 'px';
        win.style.height = Math.max(200, startH + dh) + 'px';
      }

      function stopResize() {
        document.removeEventListener('mousemove', doResize);
        document.removeEventListener('mouseup', stopResize);
      }

      document.addEventListener('mousemove', doResize);
      document.addEventListener('mouseup', stopResize);
    }

    // ============ BROWSER ============
    function renderPortfolioPage() {
      let h = '<div class="portfolio-page">';
      h += '<h1>' + D.name + '</h1>';
      h += '<div class="pp-tagline">' + D.tagline + ' | ' + D.location + '</div>';
      h += '<hr>';

      h += '<h2>About</h2>';
      h += '<p>' + D.about + '</p>';

      h += '<h2>Experience</h2>';
      D.experience.forEach(e => {
        h += '<div class="pp-exp">';
        h += '<div class="pp-exp-title">' + e.title + '</div>';
        h += '<div class="pp-exp-co">' + e.company + ' | ' + e.period + ' | ' + e.location + '</div>';
        h += '<div class="pp-exp-desc">' + e.description + '</div>';
        h += '<div class="pp-skills">' + e.skills.join(', ') + '</div>';
        h += '</div>';
      });

      h += '<h2>Education</h2>';
      D.education.forEach(e => {
        h += '<div class="pp-exp">';
        h += '<div class="pp-exp-title">' + e.degree + '</div>';
        h += '<div class="pp-exp-co">' + e.school + ' | ' + e.period + '</div>';
        h += '</div>';
      });

      h += '<h2>Skills</h2>';
      for (const [cat, skills] of Object.entries(D.skills)) {
        h += '<p><b>' + cat + ':</b> ' + skills.join(', ') + '</p>';
      }

      h += '<h2>Projects</h2>';
      D.projects.forEach(p => {
        h += '<div class="pp-exp">';
        h += '<div class="pp-exp-title">' + p.name + '</div>';
        h += '<div class="pp-exp-desc">' + p.description + '</div>';
        if (p.link) h += '<div><a href="' + p.link + '" target="_blank">View Project</a></div>';
        h += '</div>';
      });

      h += '<hr>';
      h += '<div class="pp-contact">';
      h += '<a href="mailto:' + D.email + '">' + D.email + '</a> | ';
      h += '<a href="' + D.linkedin + '" target="_blank">LinkedIn</a> | ';
      h += '<a href="' + D.github + '" target="_blank">GitHub</a>';
      h += '</div>';

      h += '<div class="pp-footer">Made with Notepad | Last updated 2026</div>';
      h += '</div>';
      return h;
    }

    // ============ DYNAMIC WINDOW SPAWNING ============
    let spawnCount = 0;

    function spawnWin(title, contentHTML, w, h) {
      spawnCount++;
      const off = ((spawnCount - 1) % 8) * 28;
      const id = 'dw-' + Date.now();
      const win = document.createElement('div');
      win.className = 'w98';
      win.id = id;
      win.style.cssText = 'display:flex;width:' + w + 'px;height:' + h + 'px;left:' + (60 + off) + 'px;top:' + (40 + off) + 'px;z-index:' + (++zIndex) + ';';
      win.innerHTML = '<div class="w98-title"><div class="w98-title-text">' + title + '</div><div class="w98-close" onclick="closeWindow(\'' + id + '\')">X</div></div><div class="w98-content" style="display:flex;flex-direction:column;">' + contentHTML + '</div><div class="w98-resize" onmousedown="startResize(event,\'' + id + '\')"></div>';
      document.body.appendChild(win);
      makeWindowDraggable(win);
      return id;
    }

    // ============ PAINT ============
    function spawnPaint() {
      const colors = ['#000','#fff','#f00','#0f0','#00f','#ff0','#0ff','#f0f','#f80','#80f','#888','#840'];
      const id = spawnWin('untitled - Paint',
        '<div style="display:flex;flex:1;min-height:0;">' +
          '<div class="paint-tools-left">' +
            '<button class="paint-tool active" title="Pencil" data-tool="pencil">&#9998;</button>' +
            '<button class="paint-tool" title="Eraser" data-tool="eraser">&#9633;</button>' +
            '<button class="paint-tool" title="Clear" data-tool="clear">&#10005;</button>' +
          '</div>' +
          '<canvas class="paint-canvas" style="flex:1;background:#fff;cursor:crosshair;border:2px solid;border-color:#808080 #dfdfdf #dfdfdf #808080;"></canvas>' +
        '</div>' +
        '<div class="paint-colors-bottom">' + colors.map(c => '<div class="paint-color" style="background:' + c + ';width:14px;height:14px;border:2px outset;cursor:pointer;" data-color="' + c + '"></div>').join('') + '</div>',
        520, 420
      );
      const win = document.getElementById(id);
      const canvas = win.querySelector('canvas');
      const ctx = canvas.getContext('2d');
      let tool = 'pencil', color = '#000', drawing = false;
      function resize() { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height); }
      setTimeout(resize, 50);
      canvas.addEventListener('mousedown', e => { drawing = true; ctx.beginPath(); const r = canvas.getBoundingClientRect(); ctx.moveTo(e.clientX-r.left, e.clientY-r.top); });
      canvas.addEventListener('mousemove', e => { if (!drawing) return; const r = canvas.getBoundingClientRect(); const x = e.clientX-r.left, y = e.clientY-r.top; if (tool === 'eraser') { ctx.fillStyle='#fff'; ctx.fillRect(x-8,y-8,16,16); } else { ctx.strokeStyle=color; ctx.lineWidth=2; ctx.lineCap='round'; ctx.lineTo(x,y); ctx.stroke(); } });
      canvas.addEventListener('mouseup', () => drawing = false);
      canvas.addEventListener('mouseleave', () => drawing = false);
      win.querySelectorAll('.paint-tool').forEach(btn => btn.addEventListener('click', function() {
        if (this.dataset.tool === 'clear') { ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height); return; }
        tool = this.dataset.tool;
        win.querySelectorAll('.paint-tool').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
      }));
      win.querySelectorAll('.paint-color').forEach(swatch => swatch.addEventListener('click', function() { color = this.dataset.color; }));
    }

    // ============ NOTEPAD ============
    function spawnNotepad() {
      const id = spawnWin('Untitled - Notepad',
        '<div class="notepad-menu">' +
          '<span onclick="notepadMenuAction(this,\'new\')"><u>F</u>ile</span>' +

        480, 380
      );
    }
    function notepadMenuAction(el, action) {
      if (action === 'new') {
        const ta = el.closest('.w98-content').querySelector('textarea');

      }
    }

    function spawnExplorer() {

        '</div>' +
        '<div style="display:flex;flex:1;min-height:0;">' +
          '<div style="width:160px;background:#fff;border-right:2px solid #808080;overflow:auto;font-family:Tahoma,Arial,sans-serif;font-size:11px;color:#000;">' +
            '<div class="explorer-item" style="font-weight:bold" data-path="C:\\\\">My Computer</div>' +

            '<div class="explorer-item" style="padding-left:36px;font-weight:bold" data-path="C:\\\\Users\\\\shrey">shrey</div>' +
            '<div class="explorer-item" style="padding-left:48px" data-path="C:\\\\Users\\\\shrey\\\\Desktop">Desktop</div>' +
            '<div class="explorer-item" style="padding-left:48px" data-path="C:\\\\Users\\\\shrey\\\\Documents">Documents</div>' +
            '<div class="explorer-item" style="padding-left:48px" data-path="C:\\\\Users\\\\shrey\\\\Downloads">Downloads</div>' +
          '</div>' +
          '<div data-files style="flex:1;background:#fff;overflow:auto;font-family:Tahoma,Arial,sans-serif;font-size:11px;color:#000;border:2px inset;border-color:#808080 #dfdfdf #dfdfdf #808080;"></div>' +
        '</div>',
        650, 450
      );
      const win = document.getElementById(id);
      win.querySelectorAll('.explorer-item').forEach(item => item.addEventListener('click', function() {
        const path = this.dataset.path;
        win.querySelector('[data-addr]').textContent = path;
        renderExplorerFiles(win.querySelector('[data-files]'), path);
      }));
      renderExplorerFiles(win.querySelector('[data-files]'), 'C:\\Users\\shrey');
    }

    function renderExplorerFiles(container, path) {
      const dir = explorerFS[path] || { folders: [], files: [] };
      let html = '';
      dir.folders.forEach(f => { html += '<div class="explorer-item" style="padding:3px 6px;">&#128193; ' + f + '</div>'; });
      dir.files.forEach(f => { html += '<div class="explorer-item" style="padding:3px 6px;">&#128196; ' + f + '</div>'; });
      if (!dir.folders.length && !dir.files.length) html = '<div style="padding:8px;color:#888;">(empty)</div>';
      container.innerHTML = html;
    }

    loadData();
  </script>
